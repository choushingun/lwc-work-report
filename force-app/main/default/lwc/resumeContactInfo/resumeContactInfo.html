<template>
  <main class="contact-info-page">
    <c-spinner lwc:if={isLoading}></c-spinner>
    <!-- 初期表示失敗時(画面を表示できない場合)もエラーが見えるよう、カードの外に出す -->
    <div lwc:if={showPageError} class="slds-notify slds-notify_alert slds-alert_error" role="alert">{errorMessage}</div>
    <lightning-card lwc:if={isAuthenticated} icon-name="standard:avatar">
      <span slot="title" class="slds-text-heading_medium slds-text-color_default page-title">基本情報</span>
      <!-- ボタンはSalesforce標準画面と同じく右上にまとめて表示する(個人情報設定画面と同じ) -->
      <lightning-button-group slot="actions">
        <lightning-button label="保存" disabled={isLoading} onclick={handleSave}></lightning-button>
        <lightning-button label="キャンセル" disabled={isLoading} onclick={handleCancel}></lightning-button>
      </lightning-button-group>

      <div class="slds-p-horizontal_medium">
        <div class="slds-section slds-is-open">
          <h2 class="slds-section__title slds-theme_shade">
            <span class="slds-truncate section-title-text">基本情報</span>
          </h2>
          <!-- 項目名の位置をそろえるため、全行を「項目名(左)・入力欄(右)」の同じ形で並べる。
               項目名は入力部品の外に表示し、必須マーク・ヘルプは項目名の後ろに置く -->
          <div class="section-body slds-p-horizontal_small">
            <div class="form-row">
              <div class="form-label">
                氏名<abbr class="slds-required required-mark" title="必須">*</abbr>
                <lightning-helptext content="姓と名の間にスペースを入れてください。"></lightning-helptext>
              </div>
              <div class="form-control">
                <lightning-input
                  label="氏名"
                  variant="label-hidden"
                  data-field="shimei"
                  value={info.shimei}
                  required
                  max-length="40"
                  onchange={handleInputChange}
                ></lightning-input>
              </div>
            </div>
            <div class="form-row">
              <div class="form-label">
                フリガナ<abbr class="slds-required required-mark" title="必須">*</abbr>
                <lightning-helptext content="姓と名の間にスペースを入れてください。"></lightning-helptext>
              </div>
              <div class="form-control">
                <lightning-input
                  label="フリガナ"
                  variant="label-hidden"
                  data-field="furigana"
                  value={info.furigana}
                  required
                  max-length="40"
                  onchange={handleInputChange}
                ></lightning-input>
              </div>
            </div>
            <div class="form-row">
              <div class="form-label">性別</div>
              <div class="form-control">
                <!-- 性別はトグルボタンで選ぶ(選択中のボタンをもう一度押すと未選択に戻す) -->
                <lightning-button-group>
                  <template for:each={genderButtons} for:item="button">
                    <lightning-button
                      key={button.value}
                      label={button.label}
                      variant={button.variant}
                      data-value={button.value}
                      onclick={handleGenderClick}
                    ></lightning-button>
                  </template>
                </lightning-button-group>
              </div>
            </div>
            <div class="form-row">
              <div class="form-label">
                出身
                <lightning-helptext content="出身校を入力してください。"></lightning-helptext>
              </div>
              <div class="form-control">
                <lightning-input
                  label="出身"
                  variant="label-hidden"
                  data-field="graduatedSchool"
                  value={info.graduatedSchool}
                  max-length="30"
                  onchange={handleInputChange}
                ></lightning-input>
              </div>
            </div>
            <div class="form-row">
              <div class="form-label">最終学歴</div>
              <div class="form-control">
                <lightning-combobox
                  label="最終学歴"
                  variant="label-hidden"
                  data-field="academicBackground"
                  value={info.academicBackground}
                  options={academicBackgroundOptions}
                  onchange={handleInputChange}
                ></lightning-combobox>
              </div>
            </div>
            <div class="form-row">
              <div class="form-label">専攻</div>
              <div class="form-control">
                <lightning-input
                  label="専攻"
                  variant="label-hidden"
                  data-field="major"
                  value={info.major}
                  max-length="30"
                  onchange={handleInputChange}
                ></lightning-input>
              </div>
            </div>
            <div class="form-row">
              <div class="form-label">
                卒業年月
                <lightning-helptext content="実務年数は卒業年月から計算します。"></lightning-helptext>
              </div>
              <div class="form-control">
                <c-year-month-picker
                  label="卒業年月"
                  data-field="graduateDate"
                  value={info.graduateDate}
                  onchange={handleInputChange}
                ></c-year-month-picker>
              </div>
            </div>
            <div class="form-row">
              <div class="form-label">来日年月</div>
              <div class="form-control">
                <c-year-month-picker
                  label="来日年月"
                  data-field="comingJapanDate"
                  value={info.comingJapanDate}
                  onchange={handleInputChange}
                ></c-year-month-picker>
              </div>
            </div>
            <div class="form-row">
              <div class="form-label">誕生日</div>
              <div class="form-control">
                <lightning-input
                  type="date"
                  class="date-input"
                  label="誕生日"
                  variant="label-hidden"
                  data-field="birthdate"
                  value={info.birthdate}
                  max={today}
                  message-when-range-overflow="今日以前の日付を入力してください。"
                  onchange={handleInputChange}
                ></lightning-input>
              </div>
            </div>
            <!-- 年齢・実務年数は数式項目のため参照のみ(誕生日・卒業年月から計算する) -->
            <div class="form-row">
              <div class="form-label">年齢</div>
              <div class="form-control form-static">{ageLabel}</div>
            </div>
            <div class="form-row">
              <div class="form-label">実務年数</div>
              <div class="form-control form-static">{experiencesLabel}</div>
            </div>
            <!-- 最寄駅は路線と駅に分けて入力する(「線」「駅」は入力欄の後ろに表示する) -->
            <div class="form-row">
              <div class="form-label">最寄駅</div>
              <div class="form-control station">
                <lightning-input
                  class="station-input"
                  label="最寄駅の路線"
                  variant="label-hidden"
                  data-field="nearestLine"
                  value={info.nearestLine}
                  max-length="30"
                  placeholder="例：山手"
                  onchange={handleInputChange}
                ></lightning-input>
                <span class="unit">線</span>
                <lightning-input
                  class="station-input"
                  label="最寄駅"
                  variant="label-hidden"
                  data-field="nearestStation"
                  value={info.nearestStation}
                  max-length="30"
                  placeholder="例：品川"
                  onchange={handleInputChange}
                ></lightning-input>
                <span class="unit">駅</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </lightning-card>

    <!-- 共通ダイアログ(キャンセル確認・処理結果を切り替えて表示する) -->
    <c-confirm-dialog
      lwc:if={dialog}
      title={dialog.title}
      messages={dialog.messages}
      confirm-label={dialog.confirmLabel}
      cancel-label={dialog.cancelLabel}
      is-error={dialog.isError}
      onconfirm={handleDialogConfirm}
      onclose={handleDialogClose}
    ></c-confirm-dialog>
  </main>
</template>
