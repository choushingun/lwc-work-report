<template>
  <main class="reset-page">
    <div class="reset-box slds-box slds-theme_default slds-is-relative">
      <c-spinner lwc:if={isLoading} alternative-text="処理中"></c-spinner>

      <h1 class="slds-text-heading_medium slds-text-align_center slds-m-bottom_large">パスワード再設定</h1>

      <!-- URLが無効・期限切れ、または変更完了後はメッセージとログイン画面へのボタンのみ表示する -->
      <template lwc:if={showMessage}>
        <p class={messageClass} role="status">{message}</p>
        <lightning-button
          class="reset-button"
          variant="brand"
          label="ログイン画面へ"
          stretch
          onclick={handleGoToLogin}
        ></lightning-button>
      </template>

      <template lwc:if={showForm}>
        <!-- 必須マーク(*)をラベルの後ろに出すため、標準のラベルは隠して独自に表示する(ログイン画面と同じ) -->
        <div class="field-label">新しいパスワード<abbr class="slds-required required-mark" title="必須">*</abbr></div>
        <lightning-input
          class="slds-m-bottom_medium"
          type="password"
          variant="label-hidden"
          label="新しいパスワード"
          name="password"
          value={password}
          min-length={minLength}
          max-length={maxLength}
          message-when-too-short={lengthMessage}
          autocomplete="new-password"
          required
          onchange={handlePasswordChange}
        ></lightning-input>
        <div class="field-label">新しいパスワード(確認)<abbr class="slds-required required-mark" title="必須">*</abbr></div>
        <lightning-input
          class="slds-m-bottom_large"
          type="password"
          variant="label-hidden"
          label="新しいパスワード(確認)"
          name="passwordConfirm"
          value={passwordConfirm}
          max-length={maxLength}
          autocomplete="new-password"
          required
          onchange={handlePasswordConfirmChange}
        ></lightning-input>
        <lightning-button
          class="reset-button"
          variant="brand"
          label="変更する"
          stretch
          disabled={isLoading}
          onclick={handleSave}
        ></lightning-button>
      </template>
    </div>
    <!-- 共通ダイアログ(エラー) -->
    <c-confirm-dialog
      lwc:if={dialog}
      title={dialog.title}
      messages={dialog.messages}
      confirm-label={dialog.confirmLabel}
      is-error={dialog.isError}
      onconfirm={handleDialogClose}
      onclose={handleDialogClose}
    ></c-confirm-dialog>
  </main>
</template>
