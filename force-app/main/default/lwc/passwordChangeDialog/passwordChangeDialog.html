<template>
  <section
    role="dialog"
    tabindex="-1"
    aria-modal="true"
    aria-labelledby="password-dialog-heading"
    class="slds-modal slds-fade-in-open"
    onkeydown={handleKeyDown}
  >
    <div class="slds-modal__container dialog">
      <div class="slds-modal__header dialog-header">
        <lightning-button-icon
          class="dialog-close"
          icon-name="utility:close"
          variant="bare"
          size="large"
          alternative-text="閉じる"
          title="閉じる"
          disabled={isLoading}
          onclick={handleClose}
        ></lightning-button-icon>
        <h1 id="password-dialog-heading" class="slds-modal__title">パスワード変更</h1>
      </div>
      <div class="slds-modal__content slds-p-around_medium slds-is-relative">
        <c-spinner lwc:if={isLoading} inline></c-spinner>
        <p lwc:if={errorMessage} class="error-message slds-m-bottom_small" role="alert">{errorMessage}</p>
        <lightning-input
          class="slds-m-bottom_small"
          type="password"
          label="現在のパスワード"
          data-name="currentPassword"
          value={currentPassword}
          max-length={maxLength}
          autocomplete="current-password"
          required
          onchange={handleInputChange}
        ></lightning-input>
        <lightning-input
          class="slds-m-bottom_small"
          type="password"
          label="新しいパスワード"
          data-name="newPassword"
          value={newPassword}
          min-length={minLength}
          max-length={maxLength}
          message-when-too-short={lengthMessage}
          field-level-help={lengthMessage}
          autocomplete="new-password"
          required
          onchange={handleInputChange}
        ></lightning-input>
        <lightning-input
          type="password"
          label="新しいパスワード(確認)"
          data-name="newPasswordConfirm"
          value={newPasswordConfirm}
          max-length={maxLength}
          autocomplete="new-password"
          required
          onchange={handleInputChange}
        ></lightning-input>
      </div>
      <div class="slds-modal__footer dialog-footer">
        <button class="slds-button slds-button_neutral" disabled={isLoading} onclick={handleClose}>キャンセル</button>
        <button class="slds-button slds-button_brand" disabled={isLoading} onclick={handleSave}>変更</button>
      </div>
    </div>
  </section>
  <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
</template>
