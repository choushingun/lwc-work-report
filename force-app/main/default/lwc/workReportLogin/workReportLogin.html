<template>
  <main class="login-page">
    <div class="login-box slds-box slds-theme_default slds-is-relative">
      <lightning-spinner
        lwc:if={isLoading}
        alternative-text="ログイン中"
        size="small"
      ></lightning-spinner>

      <h1
        class="slds-text-heading_medium slds-text-align_center slds-m-bottom_medium"
      >
        ログイン
      </h1>

      <div
        lwc:if={errorMessage}
        class="slds-text-color_error slds-m-bottom_small"
        role="alert"
      >
        {errorMessage}
      </div>

      <lightning-input
        class="slds-m-bottom_small"
        type="email"
        label="メールアドレス"
        name="email"
        value={email}
        autocomplete="username"
        required
        onchange={handleEmailChange}
        onkeydown={handleKeyDown}
      ></lightning-input>
      <lightning-input
        class="slds-m-bottom_medium"
        type="password"
        label="パスワード"
        name="password"
        value={password}
        autocomplete="current-password"
        required
        onchange={handlePasswordChange}
        onkeydown={handleKeyDown}
      ></lightning-input>

      <lightning-button
        class="login-button"
        variant="brand"
        label="ログイン"
        stretch
        disabled={isLoading}
        onclick={handleLogin}
      ></lightning-button>
    </div>
  </main>
</template>
