<template>
  <main class="worklist-page">
    <c-spinner lwc:if={isLoading}></c-spinner>
    <!-- 初回読み込み失敗時(一覧を表示できない場合)もエラーが見えるよう、カードの外に出す -->
    <div lwc:if={showPageError} class="slds-notify slds-notify_alert slds-alert_error" role="alert">{errorMessage}</div>
    <article lwc:if={isAuthenticated} class="slds-card">
      <div class="slds-card__header slds-grid slds-grid_vertical-align-center">
        <!-- タイトル左のアイコンは他画面(lightning-card の icon-name)と揃える -->
        <header class="slds-media slds-media_center slds-col slds-has-flexi-truncate">
          <div class="slds-media__figure">
            <lightning-icon icon-name="standard:timesheet" size="small"></lightning-icon>
          </div>
          <div class="slds-media__body">
            <h1 class="slds-card__header-title slds-truncate slds-text-heading_medium slds-text-color_default page-title">勤務表一覧</h1>
          </div>
        </header>
        <!-- ボタンはSalesforce標準画面と同じく右上にまとめて表示する(勤務表参照画面と同じ) -->
        <lightning-button-group class="slds-no-flex">
          <lightning-button label="打刻する" disabled={isLoading} onclick={handleClockInOut}></lightning-button>
          <lightning-button label="新規勤務表" disabled={isLoading} onclick={handleCreateReport}></lightning-button>
        </lightning-button-group>
      </div>

      <div class="slds-card__body slds-card__body_inner">
        <div class="slds-scrollable_x">
          <table class="slds-table slds-table_bordered slds-no-row-hover slds-table_cell-buffer report-table">
            <thead>
              <tr class="slds-line-height_reset">
                <th scope="col">アクション</th>
                <th scope="col">勤務表名</th>
                <th scope="col" class="slds-text-align_right slds-show_medium">勤務日数</th>
                <th scope="col" class="slds-text-align_right slds-show_medium">標準時間</th>
                <th scope="col" class="slds-text-align_right">時間</th>
                <th scope="col" class="slds-text-align_right slds-show_medium">残業(不足)時間</th>
                <th scope="col" class="slds-text-align_center">状況</th>
                <th scope="col" class="slds-show_medium">日付(申請/承認)</th>
              </tr>
            </thead>
            <tbody>
              <template for:each={displayReports} for:item="report">
                <tr key={report.Id}>
                  <td>
                    <div class="slds-button-group" role="group">
                      <button
                        class="slds-button slds-button_icon slds-button_icon-border-filled action-button"
                        title="参照"
                        data-id={report.Id}
                        onclick={handleViewReport}
                      >
                        <lightning-icon icon-name="utility:edit" size="x-small" class="icon-view"></lightning-icon>
                        <span class="slds-assistive-text">参照</span>
                      </button>
                      <button
                        class="slds-button slds-button_icon slds-button_icon-border-filled action-button"
                        title="複製"
                        data-id={report.Id}
                        onclick={handleCopyReport}
                      >
                        <lightning-icon icon-name="utility:copy" size="x-small" class="icon-copy"></lightning-icon>
                        <span class="slds-assistive-text">複製</span>
                      </button>
                      <button
                        class="slds-button slds-button_icon slds-button_icon-border-filled action-button"
                        title="削除"
                        disabled={report.deleteDisabled}
                        data-id={report.Id}
                        onclick={handleDeleteReport}
                      >
                        <lightning-icon icon-name="utility:delete" size="x-small" class="icon-delete"></lightning-icon>
                        <span class="slds-assistive-text">削除</span>
                      </button>
                    </div>
                  </td>
                  <td>{report.ReportName__c}勤務表</td>
                  <td class="slds-text-align_right slds-show_medium">{report.workDaysLabel}</td>
                  <td class="slds-text-align_right slds-show_medium">{report.StandardWorktime__c}</td>
                  <td class="slds-text-align_right">
                    <lightning-formatted-number
                      value={report.TotalWorkTime__c}
                      minimum-fraction-digits="2"
                    ></lightning-formatted-number>
                  </td>
                  <td class="slds-text-align_right slds-show_medium">
                    <!-- 不足(マイナス)の場合は赤字で表示する -->
                    <lightning-formatted-number
                      class={report.overtimeClass}
                      value={report.Overtime__c}
                      minimum-fraction-digits="2"
                    ></lightning-formatted-number>
                  </td>
                  <td class="slds-text-align_center">{report.Status__c}</td>
                  <td class="slds-show_medium">
                    <template lwc:if={report.ApplicationApprovalDT__c}>
                      <lightning-formatted-date-time
                        value={report.ApplicationApprovalDT__c}
                        year="numeric"
                        month="2-digit"
                        day="2-digit"
                        hour="numeric"
                        minute="2-digit"
                        hour12={hour12}
                        time-zone="Asia/Tokyo"
                      ></lightning-formatted-date-time>
                    </template>
                    <template lwc:else>-</template>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>

        <p lwc:if={noReports} class="slds-text-align_center slds-p-vertical_medium">勤務表がありません。</p>

        <!-- ページング -->
        <div lwc:if={hasReports} class="slds-grid slds-grid_vertical-align-center slds-m-top_small">
          <div class="slds-col slds-grid slds-grid_vertical-align-center">
            <span>{rangeLabel}</span>
            <lightning-combobox
              lwc:if={showPageSize}
              class="page-size slds-m-left_x-small"
              label="表示件数"
              variant="label-hidden"
              value={pageSizeValue}
              options={pageSizeOptions}
              onchange={handlePageSizeChange}
            ></lightning-combobox>
          </div>
          <div lwc:if={hasPaging} class="slds-no-flex">
            <lightning-button
              variant="base"
              label="前へ"
              disabled={isFirstPage}
              onclick={handlePrevious}
            ></lightning-button>
            <span class="slds-m-horizontal_small">{pageNumber}/{totalPages}</span>
            <lightning-button variant="base" label="次へ" disabled={isLastPage} onclick={handleNext}></lightning-button>
          </div>
        </div>
      </div>
    </article>
    <!-- 共通ダイアログ(削除確認・処理結果を切り替えて表示する) -->
    <c-confirm-dialog
      lwc:if={dialog}
      title={dialog.title}
      messages={dialog.messages}
      confirm-label={dialog.confirmLabel}
      cancel-label={dialog.cancelLabel}
      is-error={dialog.isError}
      onconfirm={handleDialogConfirm}
      onclose={handleDialogClose}
    ></c-confirm-dialog>
  </main>
</template>
