<template>
  <!-- 年月カレンダー(日付入力と同じ見た目。年を ‹ › で切り替え、12か月から選ぶ)
       LWRサイトではSLDSのCSSが部品の中に効かないため、SLDSのクラスは使わずこの部品のCSSで表示する -->
  <div class="picker" onfocusout={handleFocusOut} onkeydown={handleKeyDown}>
    <div class="input-wrapper">
      <!-- 年月を直接入力できる(フォーカスが外れたとき・Enter キーで確定する) -->
      <input
        type="text"
        class={inputClass}
        placeholder="例：2020/04"
        maxlength="10"
        value={inputText}
        aria-label={label}
        aria-haspopup="dialog"
        aria-expanded={ariaExpanded}
        aria-invalid={hasError}
        disabled={disabled}
        onclick={handleInputClick}
        oninput={handleInput}
        onchange={handleInputChange}
        onkeydown={handleInputKeyDown}
      />
      <button class="icon-button" title="年月を選択" disabled={disabled} onclick={handleToggle}>
        <lightning-icon icon-name="utility:event" size="xx-small" alternative-text="年月を選択"></lightning-icon>
      </button>
    </div>
    <div lwc:if={hasError} class="error-message" role="alert">{errorMessage}</div>

    <!-- 標準の日付カレンダーと同じ配置：上段は「‹ 年 ›」と年のプルダウン、中段は12か月、下段は中央に「今月」 -->
    <div lwc:if={isOpen} class="month-panel" role="dialog" aria-label={label} tabindex="-1">
      <div class="panel-header">
        <div class="year-nav">
          <lightning-button-icon
            icon-name="utility:left"
            variant="container"
            alternative-text="前の年"
            disabled={isMinYear}
            onclick={handlePrevYear}
          ></lightning-button-icon>
          <h2 class="year-title" aria-live="assertive">{viewYear}年</h2>
          <lightning-button-icon
            icon-name="utility:right"
            variant="container"
            alternative-text="次の年"
            disabled={isMaxYear}
            onclick={handleNextYear}
          ></lightning-button-icon>
        </div>
        <div class="year-select-wrapper">
          <select class="year-select" aria-label="年を選択" onchange={handleYearSelect}>
            <template for:each={yearOptions} for:item="option">
              <option key={option.value} value={option.value} selected={option.selected}>{option.label}</option>
            </template>
          </select>
        </div>
      </div>

      <div class="month-grid" role="grid">
        <template for:each={months} for:item="month">
          <div key={month.value} class="month-cell">
            <button
              class={month.className}
              aria-pressed={month.pressed}
              disabled={month.disabled}
              data-month={month.value}
              onclick={handleSelectMonth}
            >
              {month.label}
            </button>
          </div>
        </template>
      </div>

      <div class="panel-footer">
        <button class="link-button" disabled={isThisMonthDisabled} onclick={handleThisMonth}>今月</button>
      </div>
    </div>
  </div>
</template>
