<template>
  <main class="login-page">
    <div class="login-box slds-box slds-theme_default slds-is-relative">
      <c-spinner lwc:if={isLoading} alternative-text="ログイン中"></c-spinner>

      <h1
        class="slds-text-heading_medium slds-text-align_center slds-m-bottom_large"
      >
        ログイン
      </h1>

      <div
        lwc:if={errorMessage}
        class="slds-text-color_error slds-m-bottom_small"
        role="alert"
      >
        {errorMessage}
      </div>

      <!-- 必須マーク(*)をラベルの後ろに出すため、標準のラベルは隠して独自に表示する -->
      <div class="field-label">メールアドレス<abbr class="slds-required required-mark" title="必須">*</abbr></div>
      <lightning-input
        class="slds-m-bottom_medium"
        type="email"
        variant="label-hidden"
        label="メールアドレス"
        name="email"
        value={email}
        autocomplete="username"
        required
        onchange={handleEmailChange}
        onkeydown={handleKeyDown}
      ></lightning-input>
      <div class="field-label">パスワード<abbr class="slds-required required-mark" title="必須">*</abbr></div>
      <lightning-input
        class="slds-m-bottom_large"
        type="password"
        variant="label-hidden"
        label="パスワード"
        name="password"
        value={password}
        autocomplete="current-password"
        required
        onchange={handlePasswordChange}
        onkeydown={handleKeyDown}
      ></lightning-input>

      <lightning-button
        class="login-button"
        variant="brand"
        label="ログイン"
        stretch
        disabled={isLoading}
        onclick={handleLogin}
      ></lightning-button>
    </div>
  </main>
</template>
