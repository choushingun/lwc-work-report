<template>
  <main class="monthreport-page">
    <c-spinner></c-spinner>
    <!-- 初期表示失敗時(勤務表を表示できない場合)もエラーが見えるよう、カードの外に出す -->
    <div lwc:if={showPageError} class="slds-notify slds-notify_alert slds-alert_error" role="alert">{errorMessage}</div>
    <lightning-card lwc:if={isAuthenticated} icon-name="standard:timesheet">
      <span slot="title" class="slds-text-heading_medium slds-text-color_default page-title">勤務表</span>

      <div class="slds-p-horizontal_medium">
        <div lwc:if={errorMessage} class="slds-scoped-notification slds-theme_error slds-m-bottom_small" role="alert">
          <lightning-icon
            icon-name="utility:error"
            alternative-text="エラー"
            size="x-small"
            variant="inverse"
            class="slds-m-right_x-small"
          ></lightning-icon>
          {errorMessage}
        </div>
        <div lwc:if={infoMessage} class="slds-text-color_success slds-m-bottom_small" role="status">{infoMessage}</div>
        <template lwc:if={hasMessages}>
          <template for:each={messages} for:item="item">
            <!-- 注意事項は目立つよう警告(黄色)で表示する -->
            <div
              key={item.key}
              class="slds-notify slds-notify_alert slds-alert_warning slds-m-bottom_small warning-message"
              role="alert"
            >
              <lightning-icon
                icon-name="utility:warning"
                alternative-text="警告"
                size="x-small"
                class="slds-m-right_x-small"
              ></lightning-icon>
              <h2>{item.message}</h2>
            </div>
          </template>
        </template>

        <!-- 勤務表の情報 -->
        <div class="slds-section slds-is-open">
          <h2 class="slds-section__title slds-theme_shade section-title-with-action">
            <span class="slds-truncate section-title-text slds-col">勤務表の情報</span>
            <lightning-button
              class="slds-m-right_x-small"
              label="情報編集"
              title="勤務条件・承認者・プロジェクトを編集します。"
              disabled={editDisabled}
              onclick={handleEditReport}
            ></lightning-button>
            <!-- 作成完了(月末締め済)の場合は締め取消、それ以外は月末締めを表示する -->
            <lightning-button
              lwc:if={isCompleted}
              class="slds-m-right_x-small"
              variant="brand"
              label="締め取消"
              title="月末締めを取り消してドラフトに戻します。"
              disabled={cancelCompleteDisabled}
              onclick={handleCancelComplete}
            ></lightning-button>
            <lightning-button
              lwc:else
              class="slds-m-right_x-small"
              variant="brand"
              label="月末締め"
              title="月末締めをすると編集ができなくなります。"
              disabled={editDisabled}
              onclick={handleComplete}
            ></lightning-button>
          </h2>
          <div class="slds-grid slds-wrap section-body">
            <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-3">
              <table class="slds-table slds-table_bordered slds-table_striped info-table">
                <tbody>
                  <tr>
                    <th scope="row" class="info-label">作業年月</th>
                    <td>{report.Year__c}年{report.Month__c}月</td>
                  </tr>
                  <tr>
                    <th scope="row" class="info-label">自社送付先</th>
                    <td title={reportToMail}>{reportTo}</td>
                  </tr>
                  <tr>
                    <th scope="row" class="info-label">上長</th>
                    <td>{superiorName}</td>
                  </tr>
                  <tr>
                    <th scope="row" class="info-label">申請状況</th>
                    <!-- 状況はアイコンのみ表示する(マウスを乗せると状況名を表示する) -->
                    <td title={report.Status__c}>
                      <div class="slds-grid slds-grid_vertical-align-center">
                        <lightning-icon
                          icon-name={statusIcon}
                          alternative-text={report.Status__c}
                          size="xx-small"
                          class={statusClass}
                        ></lightning-icon>
                        <template lwc:if={statusDateTime}>
                          <lightning-formatted-date-time
                            class="slds-m-left_small"
                            value={statusDateTime}
                            year="numeric"
                            month="2-digit"
                            day="2-digit"
                            hour="numeric"
                            minute="2-digit"
                            hour12={hour12}
                            time-zone="Asia/Tokyo"
                          ></lightning-formatted-date-time>
                        </template>
                      </div>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
            <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-3">
              <table class="slds-table slds-table_bordered slds-table_striped info-table">
                <tbody>
                  <tr>
                    <th scope="row" class="info-label">勤務時間</th>
                    <td>{workHours}</td>
                  </tr>
                  <tr>
                    <th scope="row" class="info-label">本月標準時間</th>
                    <td>{standardHours}</td>
                  </tr>
                  <tr>
                    <th scope="row" class="info-label">勤務日数</th>
                    <td>{report.WorkDays__c}日</td>
                  </tr>
                  <tr>
                    <th scope="row" class="info-label">
                      <span title="労働時間が下限を下回るまたは上限を越える場合、赤字で表示する">総労働時間</span>
                    </th>
                    <td><span class={totalWorkTimeClass}>{totalWorkTime}</span>時間</td>
                  </tr>
                </tbody>
              </table>
            </div>
            <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-3">
              <table class="slds-table slds-table_bordered slds-table_striped info-table">
                <tbody>
                  <tr>
                    <th scope="row" class="info-label">現場責任者</th>
                    <td title={report.ApproverMail__c}>{report.Approver__c}</td>
                  </tr>
                  <tr>
                    <th scope="row" class="info-label">プロジェクト</th>
                    <td title={projects}>{projectLabel}</td>
                  </tr>
                  <tr>
                    <th scope="row" class="info-label">プロジェクトコード</th>
                    <td title={projectCodes}>{projectCodeLabel}</td>
                  </tr>
                  <tr>
                    <th scope="row" class="info-label">勤務レポート</th>
                    <!-- 月末締めで作成した勤務表ファイルがある場合のみダウンロードアイコンを表示する -->
                    <!-- 申請状況と同じく、アイコンで行が高くならないようグリッドで上下中央に配置する -->
                    <td>
                      <div class="slds-grid slds-grid_vertical-align-center">
                        <button
                          lwc:if={hasReportFile}
                          class="slds-button slds-button_icon download-button"
                          title="勤務表ファイルをダウンロードします。"
                          disabled={isLoading}
                          onclick={handleDownloadReport}
                        >
                          <lightning-icon
                            icon-name="utility:download"
                            alternative-text="ダウンロード"
                            size="xx-small"
                            class="download-icon"
                          ></lightning-icon>
                        </button>
                      </div>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>

        <!-- 勤務実績 -->
        <div class="slds-section slds-is-open">
          <h2 class="slds-section__title slds-theme_shade section-title-with-action">
            <span class="slds-truncate section-title-text slds-col">勤務実績</span>
            <lightning-button
              class="slds-m-right_x-small"
              label="実績入力"
              title="勤務実績(会社提出分)を入力します。"
              disabled={worktimeInputDisabled}
              onclick={handleWorktimeInput}
            ></lightning-button>
            <lightning-button
              class="slds-m-right_x-small"
              variant="brand"
              label="打刻する"
              title={clockTitle}
              disabled={clockDisabled}
              onclick={handleClockInOut}
            ></lightning-button>
          </h2>
          <div lwc:if={hasWorktimes} class="slds-grid slds-wrap slds-gutters_x-small section-body">
            <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-2">
              <table class="slds-table slds-table_bordered slds-table_striped worktime-table">
                <thead>
                  <tr>
                    <th scope="col" class="col-day">実績日</th>
                    <th scope="col" class="slds-text-align_center col-week">曜日</th>
                    <th scope="col" class="slds-text-align_right">開始時間</th>
                    <th scope="col" class="slds-text-align_right">終了時間</th>
                    <th scope="col" class="slds-text-align_right">休憩</th>
                    <th scope="col" class="slds-text-align_right">作業時間</th>
                  </tr>
                </thead>
                <tbody>
                  <template for:each={firstHalfRows} for:item="wt">
                    <tr key={wt.id} class={wt.rowClass} title={wt.memo}>
                      <td class="col-day">
                        {wt.dayLabel}
                        <lightning-icon
                          lwc:if={wt.hasMemo}
                          icon-name="utility:info"
                          alternative-text="備考あり"
                          size="xx-small"
                          class="memo-icon slds-m-left_xx-small"
                        ></lightning-icon>
                      </td>
                      <td class="slds-text-align_center"><span class={wt.weekClass}>{wt.week}</span></td>
                      <td class="slds-text-align_right"><span class={wt.timeClass}>{wt.startTime}</span></td>
                      <td class="slds-text-align_right"><span class={wt.timeClass}>{wt.endTime}</span></td>
                      <td class="slds-text-align_right">{wt.restTime}</td>
                      <td class="slds-text-align_right">{wt.workTime}</td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
            <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-2">
              <table class="slds-table slds-table_bordered slds-table_striped worktime-table">
                <thead class="slds-show_large">
                  <tr>
                    <th scope="col" class="col-day">実績日</th>
                    <th scope="col" class="slds-text-align_center col-week">曜日</th>
                    <th scope="col" class="slds-text-align_right">開始時間</th>
                    <th scope="col" class="slds-text-align_right">終了時間</th>
                    <th scope="col" class="slds-text-align_right">休憩</th>
                    <th scope="col" class="slds-text-align_right">作業時間</th>
                  </tr>
                </thead>
                <tbody>
                  <template for:each={secondHalfRows} for:item="wt">
                    <tr key={wt.id} class={wt.rowClass} title={wt.memo}>
                      <td class="col-day">
                        {wt.dayLabel}
                        <lightning-icon
                          lwc:if={wt.hasMemo}
                          icon-name="utility:info"
                          alternative-text="備考あり"
                          size="xx-small"
                          class="memo-icon slds-m-left_xx-small"
                        ></lightning-icon>
                      </td>
                      <td class="slds-text-align_center"><span class={wt.weekClass}>{wt.week}</span></td>
                      <td class="slds-text-align_right"><span class={wt.timeClass}>{wt.startTime}</span></td>
                      <td class="slds-text-align_right"><span class={wt.timeClass}>{wt.endTime}</span></td>
                      <td class="slds-text-align_right">{wt.restTime}</td>
                      <td class="slds-text-align_right">{wt.workTime}</td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
          </div>
          <p lwc:else class="slds-text-align_center slds-p-vertical_medium">勤務実績がありません。</p>
        </div>
      </div>
    </lightning-card>
    <!-- 月末締め確認ダイアログ -->
    <template lwc:if={showCompleteConfirm}>
      <section
        role="alertdialog"
        tabindex="-1"
        aria-modal="true"
        aria-labelledby="complete-confirm-heading"
        aria-describedby="complete-confirm-message"
        class="slds-modal slds-fade-in-open"
        onkeydown={handleCompleteConfirmKeyDown}
      >
        <div class="slds-modal__container confirm-dialog">
          <div class="slds-modal__header confirm-dialog-header">
            <lightning-button-icon
              class="confirm-dialog-close"
              icon-name="utility:close"
              variant="bare"
              size="large"
              alternative-text="閉じる"
              title="閉じる"
              onclick={handleCompleteConfirmClose}
            ></lightning-button-icon>
            <h1 id="complete-confirm-heading" class="slds-modal__title">月末締め</h1>
          </div>
          <div
            id="complete-confirm-message"
            class="slds-modal__content slds-p-horizontal_medium slds-p-top_medium slds-p-bottom_xx-large"
          >
            <p>勤務表を締めて作成完了にしますか？</p>
            <p>月末締めをすると、勤務表・勤務実績の編集ができなくなります。</p>
          </div>
          <div class="slds-modal__footer confirm-footer">
            <button class="slds-button slds-button_neutral" onclick={handleCompleteConfirmClose}>いいえ</button>
            <button class="slds-button slds-button_brand complete-confirm-button" onclick={handleCompleteConfirm}>
              はい
            </button>
          </div>
        </div>
      </section>
      <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
    </template>
  </main>
</template>
