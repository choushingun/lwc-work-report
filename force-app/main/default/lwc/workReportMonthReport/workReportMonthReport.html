<template>
  <main class="monthreport-page">
    <c-spinner></c-spinner>
    <!-- 初期表示失敗時(勤務表を表示できない場合)もエラーが見えるよう、カードの外に出す -->
    <div lwc:if={showPageError} class="slds-notify slds-notify_alert slds-alert_error" role="alert">{errorMessage}</div>
    <lightning-card lwc:if={isAuthenticated} icon-name="standard:timesheet">
      <span slot="title" class="slds-text-heading_medium slds-text-color_default page-title">勤務表</span>

      <div class="slds-p-horizontal_medium">
        <div lwc:if={errorMessage} class="slds-scoped-notification slds-theme_error slds-m-bottom_small" role="alert">
          <lightning-icon
            icon-name="utility:error"
            alternative-text="エラー"
            size="x-small"
            variant="inverse"
            class="slds-m-right_x-small"
          ></lightning-icon>
          {errorMessage}
        </div>
        <div lwc:if={infoMessage} class="slds-text-color_success slds-m-bottom_small" role="status">{infoMessage}</div>
        <template lwc:if={hasMessages}>
          <template for:each={messages} for:item="item">
            <div
              key={item.key}
              class="slds-scoped-notification slds-scoped-notification_light slds-m-bottom_small"
              role="status"
            >
              <lightning-icon
                icon-name="utility:info"
                alternative-text="お知らせ"
                size="x-small"
                class="slds-m-right_x-small"
              ></lightning-icon>
              {item.message}
            </div>
          </template>
        </template>

        <!-- 勤務表の情報(レコード詳細画面と同じく、項目名と値を2列で表示する) -->
        <div class="slds-section slds-is-open">
          <h2 class="slds-section__title section-title">
            <span class="slds-truncate slds-p-horizontal_small">勤務表の情報</span>
          </h2>
          <div class="slds-grid slds-wrap slds-gutters_medium section-body" role="list">
            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2" role="listitem">
              <div class="slds-form-element slds-form-element_horizontal slds-form-element_readonly detail-item">
                <span class="slds-form-element__label">作業年月</span>
                <div class="slds-form-element__control">
                  <div class="slds-form-element__static">{report.Year__c}年{report.Month__c}月</div>
                </div>
              </div>
            </div>
            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2" role="listitem">
              <div class="slds-form-element slds-form-element_horizontal slds-form-element_readonly detail-item">
                <span class="slds-form-element__label">申請状況</span>
                <div class="slds-form-element__control">
                  <div class="slds-form-element__static" title={report.Status__c}>
                    <div class="slds-grid slds-grid_vertical-align-center slds-wrap">
                      <lightning-icon
                        icon-name={statusIcon}
                        alternative-text={report.Status__c}
                        size="x-small"
                        class={statusClass}
                      ></lightning-icon>
                      <span class="slds-m-left_x-small">{report.Status__c}</span>
                      <template lwc:if={statusDateTime}>
                        <lightning-formatted-date-time
                          class="slds-m-left_small"
                          value={statusDateTime}
                          year="numeric"
                          month="2-digit"
                          day="2-digit"
                          hour="2-digit"
                          minute="2-digit"
                          second="2-digit"
                          hour12="false"
                          time-zone="Asia/Tokyo"
                        ></lightning-formatted-date-time>
                      </template>
                    </div>
                  </div>
                </div>
              </div>
            </div>
            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2" role="listitem">
              <div class="slds-form-element slds-form-element_horizontal slds-form-element_readonly detail-item">
                <span class="slds-form-element__label">勤務時間</span>
                <div class="slds-form-element__control">
                  <div class="slds-form-element__static">{workHours}</div>
                </div>
              </div>
            </div>
            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2" role="listitem">
              <div class="slds-form-element slds-form-element_horizontal slds-form-element_readonly detail-item">
                <span class="slds-form-element__label">本月標準時間</span>
                <div class="slds-form-element__control">
                  <div class="slds-form-element__static">{standardHours}</div>
                </div>
              </div>
            </div>
            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2" role="listitem">
              <div class="slds-form-element slds-form-element_horizontal slds-form-element_readonly detail-item">
                <span class="slds-form-element__label">勤務日数</span>
                <div class="slds-form-element__control">
                  <div class="slds-form-element__static">{report.WorkDays__c}日</div>
                </div>
              </div>
            </div>
            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2" role="listitem">
              <div class="slds-form-element slds-form-element_horizontal slds-form-element_readonly detail-item">
                <span
                  class="slds-form-element__label"
                  title="労働時間が下限を下回るまたは上限を越える場合、赤字で表示する"
                  >総労働時間</span
                >
                <div class="slds-form-element__control">
                  <div class="slds-form-element__static">
                    <span class={totalWorkTimeClass}>{totalWorkTime}</span>時間
                  </div>
                </div>
              </div>
            </div>
            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2" role="listitem">
              <div class="slds-form-element slds-form-element_horizontal slds-form-element_readonly detail-item">
                <span class="slds-form-element__label">プロジェクト</span>
                <div class="slds-form-element__control">
                  <div class="slds-form-element__static" title={projects}>{projectLabel}</div>
                </div>
              </div>
            </div>
            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2" role="listitem">
              <div class="slds-form-element slds-form-element_horizontal slds-form-element_readonly detail-item">
                <span class="slds-form-element__label">プロジェクトコード</span>
                <div class="slds-form-element__control">
                  <div class="slds-form-element__static" title={projectCodes}>{projectCodeLabel}</div>
                </div>
              </div>
            </div>
            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2" role="listitem">
              <div class="slds-form-element slds-form-element_horizontal slds-form-element_readonly detail-item">
                <span class="slds-form-element__label">現場責任者</span>
                <div class="slds-form-element__control">
                  <div class="slds-form-element__static" title={report.ApproverMail__c}>{report.Approver__c}</div>
                </div>
              </div>
            </div>
            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2" role="listitem">
              <div class="slds-form-element slds-form-element_horizontal slds-form-element_readonly detail-item">
                <span class="slds-form-element__label">上長</span>
                <div class="slds-form-element__control">
                  <div class="slds-form-element__static">{superiorName}</div>
                </div>
              </div>
            </div>
            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2" role="listitem">
              <div class="slds-form-element slds-form-element_horizontal slds-form-element_readonly detail-item">
                <span class="slds-form-element__label">自社送付先</span>
                <div class="slds-form-element__control">
                  <div class="slds-form-element__static" title={reportToMail}>{reportTo}</div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- 勤務実績 -->
        <div class="slds-section slds-is-open">
          <h2 class="slds-section__title section-title section-title-with-action">
            <span class="slds-truncate slds-p-horizontal_small slds-col">勤務実績</span>
            <lightning-button
              class="slds-m-right_x-small"
              variant="brand"
              label="打刻する"
              title={clockTitle}
              disabled={clockDisabled}
              onclick={handleClockInOut}
            ></lightning-button>
          </h2>
          <div lwc:if={hasWorktimes} class="slds-grid slds-wrap slds-gutters_x-small section-body">
            <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-2">
              <table class="slds-table slds-table_bordered slds-table_striped worktime-table">
                <thead>
                  <tr>
                    <th scope="col" class="col-day">実績日</th>
                    <th scope="col" class="slds-text-align_center col-week">曜日</th>
                    <th scope="col" class="slds-text-align_right">開始時間</th>
                    <th scope="col" class="slds-text-align_right">終了時間</th>
                    <th scope="col" class="slds-text-align_right">休憩</th>
                    <th scope="col" class="slds-text-align_right">作業時間</th>
                  </tr>
                </thead>
                <tbody>
                  <template for:each={firstHalfRows} for:item="wt">
                    <tr key={wt.id} class={wt.rowClass} title={wt.memo}>
                      <td class="col-day">
                        {wt.dayLabel}
                        <lightning-icon
                          lwc:if={wt.hasMemo}
                          icon-name="utility:info"
                          alternative-text="備考あり"
                          size="xx-small"
                          class="memo-icon slds-m-left_xx-small"
                        ></lightning-icon>
                      </td>
                      <td class="slds-text-align_center"><span class={wt.weekClass}>{wt.week}</span></td>
                      <td class="slds-text-align_right"><span class={wt.timeClass}>{wt.startTime}</span></td>
                      <td class="slds-text-align_right"><span class={wt.timeClass}>{wt.endTime}</span></td>
                      <td class="slds-text-align_right">{wt.restTime}</td>
                      <td class="slds-text-align_right">{wt.workTime}</td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
            <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-2">
              <table class="slds-table slds-table_bordered slds-table_striped worktime-table">
                <thead class="slds-show_large">
                  <tr>
                    <th scope="col" class="col-day">実績日</th>
                    <th scope="col" class="slds-text-align_center col-week">曜日</th>
                    <th scope="col" class="slds-text-align_right">開始時間</th>
                    <th scope="col" class="slds-text-align_right">終了時間</th>
                    <th scope="col" class="slds-text-align_right">休憩</th>
                    <th scope="col" class="slds-text-align_right">作業時間</th>
                  </tr>
                </thead>
                <tbody>
                  <template for:each={secondHalfRows} for:item="wt">
                    <tr key={wt.id} class={wt.rowClass} title={wt.memo}>
                      <td class="col-day">
                        {wt.dayLabel}
                        <lightning-icon
                          lwc:if={wt.hasMemo}
                          icon-name="utility:info"
                          alternative-text="備考あり"
                          size="xx-small"
                          class="memo-icon slds-m-left_xx-small"
                        ></lightning-icon>
                      </td>
                      <td class="slds-text-align_center"><span class={wt.weekClass}>{wt.week}</span></td>
                      <td class="slds-text-align_right"><span class={wt.timeClass}>{wt.startTime}</span></td>
                      <td class="slds-text-align_right"><span class={wt.timeClass}>{wt.endTime}</span></td>
                      <td class="slds-text-align_right">{wt.restTime}</td>
                      <td class="slds-text-align_right">{wt.workTime}</td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
          </div>
          <p lwc:else class="slds-text-align_center slds-p-vertical_medium">勤務実績がありません。</p>
        </div>
      </div>
    </lightning-card>
  </main>
</template>
